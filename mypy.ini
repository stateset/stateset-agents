[mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
follow_imports = skip

# Every packaged module is part of the blocking type check. Strict checks are
# enabled incrementally below for modules with stable typed contracts.
files = stateset_agents

[mypy-stateset_agents.training.async_runtime]
check_untyped_defs = true

[mypy-stateset_agents.training.distributed_rollouts]
check_untyped_defs = true

[mypy-stateset_agents.training.auto_research.checkpoint_manager]
check_untyped_defs = true

[mypy-stateset_agents.rewards.multi_objective_reward]
check_untyped_defs = true

[mypy-stateset_agents.core.agent]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-stateset_agents.core.trajectory]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

