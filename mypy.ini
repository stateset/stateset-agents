[mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
# Follow imports so cross-module and third-party types are checked; `skip`
# turned every imported name into Any. Guarded by test_mypy_allowlist_ratchet.
follow_imports = silent
# Type-check the bodies of unannotated functions everywhere, not just in
# modules with full annotations. Guarded by test_mypy_allowlist_ratchet.
check_untyped_defs = true

# Every packaged module is part of the blocking type check. Strict checks are
# enabled incrementally below for modules with stable typed contracts.
files = stateset_agents

[mypy-stateset_agents.core.agent]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-stateset_agents.core.trajectory]
disallow_untyped_defs = true
