version: 2
updates:
  # Python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "domsteil"
    assignees:
      - "domsteil"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
