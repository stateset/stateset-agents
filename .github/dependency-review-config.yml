fail_on_severity: moderate
# v4 forbids combining allow_licenses with deny_licenses; the allowlist is
# the stricter of the two, so it is the one kept.
allow_licenses:
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
  - 0BSD

vulnerability_check: true
license_check: true
