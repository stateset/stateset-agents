name: Weight Studio WebGL2 & MCP Smoke

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - "stateset_agents/weight_studio/**"
      - "stateset_agents/mcp_server.py"
      - "stateset_agents/cli_mcp.py"
      - "stateset_agents/cli_studio.py"
      - "stateset_agents/core/sandbox_pool.py"
      - "stateset_agents/training/chunked_rl_loss.py"
      - "stateset_agents/training/studio_callback.py"
      - "benchmarks/chunked_rl_shootout.py"
      - "npm/**"
      - "tests/unit/test_weight_studio.py"
      - "tests/unit/test_mcp_server.py"
      - "tests/unit/test_open_weight_rl_v90.py"
      - "examples/weight_studio_quickstart.py"
      - "examples/autonomous_surgery_autopilot.py"
      - ".github/workflows/weight-studio-smoke.yml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "stateset_agents/weight_studio/**"
      - "stateset_agents/mcp_server.py"
      - "stateset_agents/cli_mcp.py"
      - "stateset_agents/cli_studio.py"
      - "stateset_agents/core/sandbox_pool.py"
      - "stateset_agents/training/chunked_rl_loss.py"
      - "stateset_agents/training/studio_callback.py"
      - "benchmarks/chunked_rl_shootout.py"
      - "npm/**"
      - "tests/unit/test_weight_studio.py"
      - "tests/unit/test_mcp_server.py"
      - "tests/unit/test_open_weight_rl_v90.py"
      - "examples/weight_studio_quickstart.py"
      - "examples/autonomous_surgery_autopilot.py"
      - ".github/workflows/weight-studio-smoke.yml"
  workflow_dispatch:

jobs:
  weight-studio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Weight Studio, MCP & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: TypeScript / Node SDK tests & typecheck
        run: |
          npm --prefix npm ci
          npm --prefix npm test

      - name: Lint, type-check, examples & unit/MCP protocol tests
        run: |
          ruff check stateset_agents/weight_studio stateset_agents/mcp_server.py stateset_agents/cli_mcp.py stateset_agents/cli_studio.py tests/unit/test_weight_studio.py tests/unit/test_mcp_server.py examples/weight_studio_quickstart.py examples/autonomous_surgery_autopilot.py
          mypy --config-file mypy.ini --no-incremental --cache-dir=/dev/null stateset_agents/weight_studio stateset_agents/mcp_server.py stateset_agents/cli_mcp.py stateset_agents/cli_studio.py
          pytest -q -m "" tests/unit/test_weight_studio.py tests/unit/test_mcp_server.py tests/unit/test_open_weight_rl_v90.py tests/unit/test_torch_import_policy.py
          python examples/weight_studio_quickstart.py
          python examples/autonomous_surgery_autopilot.py
          python examples/open_weight_rl_end_to_end.py
          python benchmarks/chunked_rl_shootout.py

      - name: Headless Chromium WebGL2 Studio & Live HTTP MCP SSE Smoke
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import time
          import urllib.request
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(
              [sys.executable, "-m", "stateset_agents.weight_studio", "--host", "127.0.0.1", "--port", "8765", "--workspace", "."],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          try:
              for _ in range(40):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8765/api/weight-studio/health", timeout=1.0) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      time.sleep(0.25)

              console_errors = []
              page_errors = []
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--use-gl=angle", "--use-angle=swiftshader", "--enable-webgl", "--ignore-gpu-blocklist", "--disable-dev-shm-usage"],
                  )
                  page = browser.new_page(viewport={"width": 1440, "height": 900})
                  page.on("console", lambda m: console_errors.append(m.text) if m.type == "error" else None)
                  page.on("pageerror", lambda e: page_errors.append(str(e)))
                  page.goto("http://127.0.0.1:8765/studio", wait_until="networkidle")
                  page.wait_for_timeout(800)

                  for mode in ("circuit", "attention", "residual", "microscope"):
                      page.click(f'.mode-pill[data-mode="{mode}"]')
                      page.wait_for_timeout(450)
                  page.click("#btn-toggle-split")
                  page.wait_for_timeout(300)

                  # Verify v8 Autonomous Self-Heal, Red-Team Audit & Canary Gate cards
                  page.click('.wb-tab[data-tab="edit"]')
                  page.click("#btn-run-auto-heal")
                  page.wait_for_function("() => !['READY', 'HEALING…'].includes(document.querySelector('#heal-status-pill')?.textContent || '')", timeout=15000)
                  page.click("#btn-run-redteam-audit")
                  page.wait_for_function("() => !['READY', 'AUDITING…'].includes(document.querySelector('#redteam-status-pill')?.textContent || '')", timeout=15000)
                  page.click("#btn-run-canary")
                  page.wait_for_function("() => !['READY', 'GATING…'].includes(document.querySelector('#canary-status-pill')?.textContent || '')", timeout=15000)

                  # Verify Live OTLP Trace Ingestion, Reward Calibration & Modular ⌘K Command Palette
                  page.click("#btn-ingest-trace")
                  page.wait_for_function("() => (document.querySelector('#traces-result-summary')?.textContent || '').includes('Ingested')", timeout=15000)
                  page.click("#btn-audit-calibration")
                  page.wait_for_function("() => (document.querySelector('#traces-result-summary')?.textContent || '').includes('Verdict:')", timeout=15000)
                  page.click("#btn-cmd-palette")
                  page.fill("#cmd-palette-input", "calibration")
                  assert "Audit Reward Calibration" in (page.text_content("#cmd-palette-list") or "")
                  page.keyboard.press("Escape")

                  # Verify Live Streamable HTTP MCP -> real-time browser SSE activity stream
                  page.click("#btn-mcp-modal")
                  page.wait_for_timeout(200)
                  req = urllib.request.Request(
                      "http://127.0.0.1:8765/api/weight-studio/mcp",
                      data=json.dumps({
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "tools/call",
                          "params": {
                              "name": "studio_apply_edit",
                              "arguments": {
                                  "model_id": "preset:deepseek-r1-1.5b",
                                  "op": "scale",
                                  "target": "layer:0",
                                  "params": {"factor": 1.02},
                                  "label": "CI HTTP MCP Live Edit",
                              },
                          },
                      }).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      assert r.status == 200
                  page.wait_for_function("() => (document.querySelector('#mcp-activity-log')?.textContent || '').includes('studio_apply_edit')", timeout=8000)
                  page.click("#btn-close-mcp")

                  # Verify Live RL Cockpit (Sparkline, Pause/Rollback, 3-Domain Pool & Cloud Plan)
                  page.click('.wb-tab[data-tab="autopilot"]')
                  page.wait_for_selector("#btn-rl-cockpit-pulse", state="visible", timeout=10000)
                  page.click("#btn-rl-cockpit-pulse")
                  page.wait_for_function("() => (document.querySelector('#rl-cockpit-pill')?.textContent || '').includes('STEP 1')", timeout=10000)
                  page.click("#btn-rl-sandbox-pool")
                  page.wait_for_function("() => (document.querySelector('#rl-cockpit-pill')?.textContent || '').includes('POOL')", timeout=15000)
                  page.click("#btn-rl-blueprint")
                  page.wait_for_function("() => (document.querySelector('#rl-cockpit-pill')?.textContent || '').includes('PLAN')", timeout=10000)
                  page.click("#btn-rl-pause")
                  page.wait_for_function("() => (document.querySelector('#rl-cockpit-pill')?.textContent || '').includes('PAUSED')", timeout=10000)
                  page.click("#btn-rl-rollback")
                  page.wait_for_function("() => (document.querySelector('#rl-cockpit-pill')?.textContent || '').includes('ROLLBACK')", timeout=10000)

                  page.click("#btn-export-modal")
                  page.click("#btn-run-eval-gate")
                  page.wait_for_timeout(800)

                  verdict = page.text_content("#eval-verdict-pill")
                  assert verdict in {"GO", "WARN", "BLOCK"}, f"Unexpected eval verdict: {verdict}"
                  assert len(console_errors) == 0, f"Console errors: {console_errors}"
                  assert len(page_errors) == 0, f"Page errors: {page_errors}"
                  print("Weight Studio WebGL2 & Live HTTP MCP E2E Smoke PASSED (verdict=", verdict, ")")
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=10)
          PY
