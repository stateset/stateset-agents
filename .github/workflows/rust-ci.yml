name: Rust CI

# Fast lint/check/test gate for both Rust crates in this repo:
#   * the root crate (internal StateSet commerce daemon, `publish = false`)
#   * rust_core (`stateset-rl-core`, the pyo3 accelerator)
#
# This does NOT build Python wheels — see rust-wheels.yml for that.
#
# Clippy is scoped with `-A dead_code -A unused_variables -A unused_imports
# -A unused_mut` on purpose: the root crate carries a fair amount of
# scaffolding for the commerce daemon (unimplemented gRPC methods, WIP
# fields) that isn't fully wired up yet, and a mass cleanup of those is out
# of scope here. Real lint issues (correctness, style, etc.) still gate the
# build.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust_core/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust_core/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  root-check:
    name: Root crate — check & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "."

      - name: cargo check --all-targets
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings -A dead_code -A unused_variables -A unused_imports -A unused_mut

  rust-core-test:
    name: rust_core — check, clippy & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "rust_core"

      - name: cargo check (no python feature — libpython not required)
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings -A dead_code -A unused_variables -A unused_imports -A unused_mut

      - name: cargo test
        run: cargo test
