name: Docker images (build validation)

on:
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build API gateway image (no push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deployment/docker/Dockerfile
        target: runtime
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build trainer image (no push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deployment/docker/Dockerfile.trainer
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
