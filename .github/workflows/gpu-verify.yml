name: GPU Verify

# Weekly proof that the packaged training job still works on real rented
# hardware — the property the docs advertise ("verified end-to-end on live
# hardware") kept true continuously instead of asserted once.
#
# Rents a RunPod GPU via the same `train-remote --provider runpod` path users
# run, trains a real QLoRA adapter on Qwen3.5-0.8B from a tiny inline
# dataset, and fails unless an adapter with tensors comes back. The executor
# terminates the pod on every exit path, so a failed run does not keep
# billing. Cost per run is a few cents (RTX A4000, ~5-10 minutes).
#
# Requires the RUNPOD_API_KEY repository secret; without it the job reports
# itself as skipped rather than failing, so forks stay green.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      gpu:
        description: 'RunPod GPU type'
        required: false
        default: 'NVIDIA RTX A4000'

permissions:
  contents: read

jobs:
  sft-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

    steps:
    - uses: actions/checkout@v7

    - name: Check for RunPod credentials
      id: creds
      run: |
        if [ -n "$RUNPOD_API_KEY" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::RUNPOD_API_KEY secret not set — skipping GPU verification."
        fi

    - name: Set up Python
      if: steps.creds.outputs.present == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package
      if: steps.creds.outputs.present == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[remote]" 2>/dev/null || pip install -e .

    - name: Generate ephemeral SSH keypair
      if: steps.creds.outputs.present == 'true'
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q

    - name: Build a wheel of the checked-out source
      # The remote job installs a pinned published package by default; a
      # wheel of the current checkout verifies HEAD, not last release.
      if: steps.creds.outputs.present == 'true'
      run: |
        pip install build
        python -m build --wheel

    - name: Write smoke dataset
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import json

        rows = [
            {
                "messages": [
                    {"role": "user", "content": f"Say the number {i}."},
                    {"role": "assistant", "content": f"The number is {i}."},
                ]
            }
            for i in range(32)
        ]
        with open("gpu_smoke.jsonl", "w", encoding="utf-8") as fh:
            for row in rows:
                fh.write(json.dumps(row) + "\n")
        PY

    - name: Run live QLoRA training on RunPod
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import glob
        import sys
        from pathlib import Path

        from stateset_agents.remote.job import RemoteJobSpec
        from stateset_agents.remote.runpod import RunPodExecutor

        wheel = next(iter(glob.glob("dist/stateset_agents-*.whl")), None)
        assert wheel, "wheel not built"

        gpu = "${{ github.event.inputs.gpu || 'NVIDIA RTX A4000' }}"
        spec = RemoteJobSpec(
            dataset=Path("gpu_smoke.jsonl"),
            base_model="Qwen/Qwen3.5-0.8B",
            output_dir=Path("outputs/gpu_verify"),
            num_epochs=1,
            lora_r=8,
            gpu=gpu,
            timeout_s=1800,
            # Held-out prompts with expect-specs: the job returns
            # eval_results.json with base-vs-finetuned completions AND
            # exits non-zero unless each finetuned completion contains
            # "number" — the weekly check gates on content, not just on
            # adapter tensors existing.
            eval_prompts=[
                {"prompt": "Say the number 41.", "expect": ["number"]},
                {"prompt": "Say the number 77.", "expect": ["number"]},
            ],
        )
        executor = RunPodExecutor(wheel=Path(wheel))
        result = executor.wait(executor.submit(spec))
        for line in result.logs:
            print(line)
        if not result.succeeded:
            print(f"::error::Remote job {result.status.value}.")
            sys.exit(1)
        print("Adapter written to", result.output_dir)

        adapter_files = list(Path("outputs/gpu_verify").rglob("*.safetensors"))
        if not adapter_files:
            print("::error::No adapter tensors returned from the GPU run.")
            sys.exit(1)
        for f in adapter_files:
            print(f, f.stat().st_size, "bytes")

        import json

        eval_path = Path("outputs/gpu_verify/eval_results.json")
        if not eval_path.exists():
            print("::error::eval_results.json was not returned.")
            sys.exit(1)
        rows = json.loads(eval_path.read_text())
        bad = [
            r
            for r in rows
            if not (r.get("base") and r.get("finetuned"))
            or not r.get("checks", {}).get("passed")
        ]
        if len(rows) != 2 or bad:
            print(f"::error::eval comparison incomplete or failed checks: {rows}")
            sys.exit(1)
        for r in rows:
            print("EVAL", r["prompt"], "->", r["finetuned"][:60])
        PY

    - name: Upload adapter artifact
      if: steps.creds.outputs.present == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gpu-verify-adapter
        path: outputs/gpu_verify
        retention-days: 14

  # Same weekly proof for the RL path: rents the same cheap GPU and runs a
  # short real GSPO training (tiny GPT-2, single-token preference task),
  # asserting the target-token probability strictly increases — the same
  # convergence property the nightly CPU e2e test checks, now on real CUDA.
  rl-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

    steps:
    - uses: actions/checkout@v7

    - name: Check for RunPod credentials
      id: creds
      run: |
        if [ -n "$RUNPOD_API_KEY" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::RUNPOD_API_KEY secret not set — skipping RL GPU verification."
        fi

    - name: Set up Python
      if: steps.creds.outputs.present == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package
      if: steps.creds.outputs.present == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[remote]" 2>/dev/null || pip install -e .

    - name: Generate ephemeral SSH keypair
      if: steps.creds.outputs.present == 'true'
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q

    - name: Build a wheel of the checked-out source
      if: steps.creds.outputs.present == 'true'
      run: |
        pip install build
        python -m build --wheel

    - name: Run live GSPO verification on RunPod
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import glob
        import sys
        import uuid
        from pathlib import Path

        from stateset_agents.remote.runpod import (
            RunPodApi,
            RunPodExecutor,
            SshTransport,
            package_pin,
        )

        wheel_path = next(iter(glob.glob("dist/stateset_agents-*.whl")), None)
        assert wheel_path, "wheel not built"
        wheel = Path(wheel_path)

        gpu = "${{ github.event.inputs.gpu || 'NVIDIA RTX A4000' }}"
        executor = RunPodExecutor(wheel=wheel)
        api = executor._require_api()
        public_key = executor._require_public_key()

        job_id = uuid.uuid4().hex[:12]
        pod = api.create_pod(
            name=f"gpu-verify-rl-{job_id}",
            image=executor.image,
            gpu_type_id=gpu,
            ports=["22/tcp"],
            env={"PUBLIC_KEY": public_key, "SSH_PUBLIC_KEY": public_key},
        )
        pod_id = str(pod["id"])
        print(f"created pod {pod_id} ({gpu})")

        exit_code = 1
        try:
            host, port = executor._wait_for_ssh_endpoint(api, pod_id)
            print(f"pod reachable at {host}:{port}")
            ssh = SshTransport()
            ssh.wait_until_reachable(host, port, executor.ready_timeout_s)
            ssh.upload(wheel, f"/workspace/{wheel.name}")

            pin = package_pin(wheel, None)
            exit_code, output = ssh.run(
                "set -o pipefail; "
                f"pip install --quiet '{pin}' && "
                "python -m stateset_agents.training.gpu_verify_rl"
            )
            print(output)
        finally:
            # Unconditional: an orphaned pod bills by the hour.
            api.terminate_pod(pod_id)
            print(f"terminated pod {pod_id}")

        if exit_code != 0:
            print(f"::error::RL GPU verification exited {exit_code}.")
            sys.exit(1)
        PY
