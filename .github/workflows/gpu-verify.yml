name: GPU Verify

# Weekly proof that the packaged training job still works on real rented
# hardware — the property the docs advertise ("verified end-to-end on live
# hardware") kept true continuously instead of asserted once.
#
# Rents a RunPod GPU via the same `train-remote --provider runpod` path users
# run, trains a real QLoRA adapter on Qwen3.5-0.8B from a tiny inline
# dataset, and fails unless an adapter with tensors comes back. The executor
# terminates the pod on every exit path, so a failed run does not keep
# billing. Cost per run is a few cents (RTX A4000, ~5-10 minutes).
#
# Requires the RUNPOD_API_KEY repository secret. Scheduled and manually
# dispatched verification must fail when it is absent: a green job in which
# every GPU step was skipped is false evidence, not a successful canary.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      gpu:
        description: 'RunPod GPU type'
        required: false
        default: 'NVIDIA RTX A4000'

permissions:
  contents: read

concurrency:
  group: gpu-verify
  cancel-in-progress: false

jobs:
  sft-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

    steps:
    - uses: actions/checkout@v7

    - name: Check for RunPod credentials
      id: creds
      run: |
        if [ -n "$RUNPOD_API_KEY" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::error::RUNPOD_API_KEY secret not set — live GPU verification cannot run."
          exit 1
        fi

    - name: Set up Python
      if: steps.creds.outputs.present == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install package
      if: steps.creds.outputs.present == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[remote]" 2>/dev/null || pip install -e .

    - name: Generate ephemeral SSH keypair
      if: steps.creds.outputs.present == 'true'
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q

    - name: Build a wheel of the checked-out source
      # The remote job installs a pinned published package by default; a
      # wheel of the current checkout verifies HEAD, not last release.
      if: steps.creds.outputs.present == 'true'
      run: |
        pip install build
        python -m build --wheel

    - name: Write smoke dataset
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import json

        rows = [
            {
                "messages": [
                    {"role": "user", "content": f"Say the number {i}."},
                    {"role": "assistant", "content": f"The number is {i}."},
                ]
            }
            for i in range(32)
        ]
        with open("gpu_smoke.jsonl", "w", encoding="utf-8") as fh:
            for row in rows:
                fh.write(json.dumps(row) + "\n")
        PY

    - name: Run live QLoRA training on RunPod
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import glob
        import hashlib
        import json
        import os
        import sys
        from pathlib import Path

        from stateset_agents.remote.job import RemoteJobSpec
        from stateset_agents.remote.runpod import RunPodExecutor

        wheel = next(iter(glob.glob("dist/stateset_agents-*.whl")), None)
        assert wheel, "wheel not built"

        gpu = "${{ github.event.inputs.gpu || 'NVIDIA RTX A4000' }}"
        spec = RemoteJobSpec(
            dataset=Path("gpu_smoke.jsonl"),
            base_model="Qwen/Qwen3.5-0.8B",
            output_dir=Path("outputs/gpu_verify"),
            num_epochs=1,
            lora_r=8,
            gpu=gpu,
            cloud_type="COMMUNITY",
            timeout_s=1800,
            container_disk_gb=40,
            max_cost_usd=0.50,
            # Held-out prompts with expect-specs: the job returns
            # eval_results.json with base-vs-finetuned completions AND
            # exits non-zero unless each finetuned completion contains
            # "number" — the weekly check gates on content, not just on
            # adapter tensors existing.
            eval_prompts=[
                {"prompt": "Say the number 41.", "expect": ["number"]},
                {"prompt": "Say the number 77.", "expect": ["number"]},
            ],
        )
        # One pod only: max_cost_usd is therefore a total workflow ceiling,
        # not a per-attempt ceiling multiplied by spot-pod retries.
        executor = RunPodExecutor(wheel=Path(wheel), max_provision_attempts=1)
        result = executor.wait(executor.submit(spec))
        for line in result.logs:
            print(line)
        if not result.succeeded:
            print(f"::error::Remote job {result.status.value}.")
            sys.exit(1)
        print("Adapter written to", result.output_dir)

        adapter_files = list(Path("outputs/gpu_verify").rglob("*.safetensors"))
        if not adapter_files:
            print("::error::No adapter tensors returned from the GPU run.")
            sys.exit(1)
        for f in adapter_files:
            print(f, f.stat().st_size, "bytes")

        eval_path = Path("outputs/gpu_verify/eval_results.json")
        if not eval_path.exists():
            print("::error::eval_results.json was not returned.")
            sys.exit(1)
        rows = json.loads(eval_path.read_text())
        bad = [
            r
            for r in rows
            if not (r.get("base") and r.get("finetuned"))
            or not r.get("checks", {}).get("passed")
        ]
        if len(rows) != 2 or bad:
            print(f"::error::eval comparison incomplete or failed checks: {rows}")
            sys.exit(1)
        for r in rows:
            print("EVAL", r["prompt"], "->", r["finetuned"][:60])

        def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()

        evidence = {
            "schema_version": 1,
            "kind": "sft",
            "commit": os.environ["GITHUB_SHA"],
            "model": spec.base_model,
            "gpu_requested": gpu,
            "image": executor.image,
            "dataset_sha256": digest(spec.dataset),
            "wheel_sha256": digest(Path(wheel)),
            "duration_s": result.duration_s,
            "cost_usd": result.cost_usd,
            "max_cost_usd": spec.max_cost_usd,
            "cleanup_confirmed": True,
            "eval_sha256": digest(eval_path),
            "artifacts": {
                str(path.relative_to(spec.output_dir)): {
                    "sha256": digest(path),
                    "size": path.stat().st_size,
                }
                for path in sorted(adapter_files)
            },
        }
        (spec.output_dir / "evidence.json").write_text(
            json.dumps(evidence, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

    - name: Upload adapter artifact
      if: steps.creds.outputs.present == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: gpu-verify-adapter
        path: outputs/gpu_verify
        retention-days: 14

  # Same weekly proof for the RL path: rents the same cheap GPU and runs a
  # short real GSPO training (tiny GPT-2, single-token preference task),
  # asserting the target-token probability strictly increases — the same
  # convergence property the nightly CPU e2e test checks, now on real CUDA.
  rl-live-smoke:
    # Run after SFT so two low-cost A4000 requests do not race for the same
    # scarce Community Cloud capacity (observed live as one success + one 500).
    needs: sft-live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

    steps:
    - uses: actions/checkout@v7

    - name: Check for RunPod credentials
      id: creds
      run: |
        if [ -n "$RUNPOD_API_KEY" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::error::RUNPOD_API_KEY secret not set — live RL GPU verification cannot run."
          exit 1
        fi

    - name: Set up Python
      if: steps.creds.outputs.present == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install package
      if: steps.creds.outputs.present == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[remote]" 2>/dev/null || pip install -e .

    - name: Generate ephemeral SSH keypair
      if: steps.creds.outputs.present == 'true'
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q

    - name: Build a wheel of the checked-out source
      if: steps.creds.outputs.present == 'true'
      run: |
        pip install build
        python -m build --wheel

    - name: Run live GSPO verification on RunPod
      if: steps.creds.outputs.present == 'true'
      run: |
        python - <<'PY'
        import glob
        import hashlib
        import json
        import math
        import os
        import shlex
        import sys
        import tempfile
        import time
        import uuid
        from pathlib import Path

        from stateset_agents.remote.ledger import (
            BudgetExceeded,
            check_budget,
            estimate_cost_usd,
        )
        from stateset_agents.remote.runpod import (
            RunPodApi,
            RunPodExecutor,
            SshTransport,
            package_pin,
        )
        from stateset_agents.remote.serve_session import self_destruct_script

        wheel_path = next(iter(glob.glob("dist/stateset_agents-*.whl")), None)
        assert wheel_path, "wheel not built"
        wheel = Path(wheel_path)

        gpu = "${{ github.event.inputs.gpu || 'NVIDIA RTX A4000' }}"
        executor = RunPodExecutor(wheel=wheel)
        api = executor._require_api()
        public_key = executor._require_public_key()
        max_lifetime_s = 1200
        max_cost_usd = 0.50

        job_id = uuid.uuid4().hex[:12]
        pod = api.create_pod(
            name=f"gpu-verify-rl-{job_id}",
            image=executor.image,
            gpu_type_id=gpu,
            cloud_type="COMMUNITY",
            ports=["22/tcp"],
            env={"PUBLIC_KEY": public_key, "SSH_PUBLIC_KEY": public_key},
            container_disk_gb=40,
        )
        pod_id = str(pod["id"])
        pod_started_at = time.time()
        print(f"created pod {pod_id} ({gpu}, max ${max_cost_usd:.2f})")

        exit_code = 1
        output = ""
        summary = None
        termination_confirmed = False
        try:
            raw_price = pod.get("costPerHr")
            if raw_price is None:
                raw_price = api.get_pod(pod_id).get("costPerHr")
            try:
                cost_per_hr = float(raw_price)
            except (TypeError, ValueError) as exc:
                raise RuntimeError("RunPod did not report a usable pod price") from exc
            try:
                worst_case = check_budget(
                    cost_per_hr,
                    max_lifetime_s,
                    max_cost_usd,
                    # costPerHr is the effective whole-pod price.
                    gpu_count=1,
                )
            except BudgetExceeded as exc:
                raise RuntimeError(str(exc)) from exc
            print(
                f"authoritative price ${cost_per_hr:.4f}/hr; "
                f"worst case ${worst_case:.4f}"
            )

            host, port = executor._wait_for_ssh_endpoint(api, pod_id)
            print(f"pod reachable at {host}:{port}")
            ssh = SshTransport()
            remaining = max_lifetime_s - math.ceil(time.time() - pod_started_at)
            if remaining <= 0:
                raise RuntimeError("pod exhausted its lifetime before SSH readiness")
            ssh.wait_until_reachable(host, port, min(executor.ready_timeout_s, remaining))

            # The runner's finally block is the primary cleanup. This remote
            # watchdog is the independent backstop if the hosted runner dies.
            remaining = max_lifetime_s - math.ceil(time.time() - pod_started_at)
            if remaining <= 0:
                raise RuntimeError("pod exhausted its lifetime before watchdog setup")
            key_file = "/workspace/.gpu_verify_runpod_key"
            script_path = "/workspace/gpu_verify_self_destruct.sh"
            ssh.upload_secret(api.api_key, key_file)
            with tempfile.TemporaryDirectory() as staging:
                local_script = Path(staging) / "self-destruct.sh"
                local_script.write_text(
                    self_destruct_script(
                        pod_id,
                        remaining / 3600,
                        api.root,
                        key_file=key_file,
                    ),
                    encoding="utf-8",
                )
                ssh.upload(local_script, script_path)
            arm_code, arm_output = ssh.run(
                f"chmod 600 {shlex.quote(key_file)} {shlex.quote(script_path)} && "
                f"(nohup bash {shlex.quote(script_path)} "
                "> /workspace/gpu_verify_self_destruct.log 2>&1 < /dev/null &)"
            )
            if arm_code != 0:
                raise RuntimeError(f"could not arm self-destruct: {arm_output}")
            print(f"armed remote self-destruct with {remaining}s remaining")

            ssh.upload(wheel, f"/workspace/{wheel.name}")

            pin = package_pin(wheel, None)
            exit_code, output = ssh.run(
                "set -o pipefail; "
                f"pip install --quiet '{pin}' && "
                "python -m stateset_agents.training.gpu_verify_rl"
            )
            print(output)
            summary_lines = [
                line
                for line in output.splitlines()
                if line.startswith("GPU_VERIFY_RL_SUMMARY ")
            ]
            if len(summary_lines) != 1:
                raise RuntimeError("RL verification emitted no unique JSON summary")
            summary = json.loads(summary_lines[0].split(" ", 1)[1])
            if summary.get("device") != "cuda" or not summary.get("gpu"):
                raise RuntimeError(f"RL verification did not use CUDA: {summary}")
            if not summary.get("converged"):
                raise RuntimeError(f"RL verification did not converge: {summary}")
        finally:
            # Unconditional: an orphaned pod bills by the hour.
            api.terminate_pod(pod_id)
            termination_confirmed = True
            print(f"terminated pod {pod_id}")

        if exit_code != 0:
            print(f"::error::RL GPU verification exited {exit_code}.")
            sys.exit(1)

        duration_s = time.time() - pod_started_at
        output_dir = Path("outputs/gpu_verify_rl")
        output_dir.mkdir(parents=True, exist_ok=True)
        evidence = {
            "schema_version": 1,
            "kind": "gspo",
            "commit": os.environ["GITHUB_SHA"],
            "gpu_requested": gpu,
            "gpu_observed": summary["gpu"],
            "image": executor.image,
            "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
            "duration_s": round(duration_s, 3),
            "cost_per_hr": cost_per_hr,
            "cost_usd": estimate_cost_usd(cost_per_hr, duration_s),
            "max_cost_usd": max_cost_usd,
            "max_lifetime_s": max_lifetime_s,
            "cleanup_confirmed": termination_confirmed,
            "summary": summary,
        }
        (output_dir / "evidence.json").write_text(
            json.dumps(evidence, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

    - name: Upload RL verification evidence
      if: steps.creds.outputs.present == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: gpu-verify-rl-evidence
        path: outputs/gpu_verify_rl/evidence.json
        retention-days: 14
