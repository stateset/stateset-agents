name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run security scans weekly
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-security-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-security-

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit "pip-audit>=2.10.1,<3.0.0" "semgrep>=1.173.0"

    - name: Install Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin v0.73.0

    - name: Run Bandit security linter
      run: |
        scan_exit_code=0
        bandit -c pyproject.toml -r stateset_agents -f json -o bandit-report.json > bandit-report.txt 2>&1 || scan_exit_code=$?
        printf '%s\n' "$scan_exit_code" > bandit-exit-code.txt

    - name: Run pip-audit dependency check
      run: |
        # cuda-toolkit is an extras meta-package; concrete CUDA components
        # remain pinned and audited below.
        grep -v '^cuda-toolkit\[' requirements-dev-lock.txt > /tmp/stateset-audit-requirements.txt
        scan_exit_code=0
        pip-audit -r /tmp/stateset-audit-requirements.txt --no-deps --disable-pip --format json > pip-audit-report.json 2> pip-audit-report.txt || scan_exit_code=$?
        printf '%s\n' "$scan_exit_code" > pip-audit-exit-code.txt

    - name: Run Semgrep security analysis
      run: |
        scan_exit_code=0
        semgrep scan --config=p/security-audit --metrics=off --disable-version-check --jobs=2 --timeout=30 --strict --error --json > semgrep-report.json 2> semgrep-report.txt || scan_exit_code=$?
        printf '%s\n' "$scan_exit_code" > semgrep-exit-code.txt

    - name: Run Trivy vulnerability scan
      run: |
        scan_exit_code=0
        trivy fs --format json . > trivy-report.json 2> trivy-report.txt || scan_exit_code=$?
        printf '%s\n' "$scan_exit_code" > trivy-exit-code.txt

    - name: Validate security reports and scanner exits
      if: always()
      run: |
        if python -m scripts.security_workflow_gate --source-root stateset_agents --output security-gate.json; then
          echo "Security gate passed: all scanner reports and exit codes validated." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Security gate failed: inspect security-gate.json and scanner diagnostics." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          bandit-report.json
          bandit-report.txt
          bandit-exit-code.txt
          pip-audit-report.json
          pip-audit-report.txt
          pip-audit-exit-code.txt
          semgrep-report.json
          semgrep-report.txt
          semgrep-exit-code.txt
          trivy-report.json
          trivy-report.txt
          trivy-exit-code.txt
          security-gate.json

  dependency-review:
    # The action diffs dependencies between two refs, which only exist on
    # pull_request events; on push it errors with "base ref and head ref
    # must be provided".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        config-file: '.github/dependency-review-config.yml'

  secrets-detection:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Secret Detection
      uses: trufflesecurity/trufflehog@v3.96.0
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --only-verified

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        config-file: ./.github/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
