name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  river-native:
    strategy:
      fail-fast: false
      matrix:
        river_sdk: ["==0.11.0", ">=0.11.0,<0.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install the optional River runtime
      # Keep this separate from dev: SDK and static-analysis tools can impose
      # conflicting dependency ranges. These tests need no model downloads.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[river]" "river-client${{ matrix.river_sdk }}"
        python -m pip check
        python -c "from river_client import rl; from importlib.metadata import version; print('river-client', version('river-client'))"

    - name: Verify native scheduling and recovery without paid calls
      env:
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: |
        python scripts/check_asyncio_wakeup.py
        python -m unittest discover -s tests/integration -p test_river_native_sdk.py -v
        pip install pytest pytest-asyncio pytest-xdist pytest-timeout
        pytest --confcutdir=tests/unit -n 0 -o addopts='' tests/unit/test_river_nemotron.py

  npm-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: npm/package-lock.json

    - name: Test and pack the Node client
      working-directory: npm
      run: |
        npm ci
        npm test
        npm run pack:check

  publish-readiness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"
        pip install bandit pip-audit build twine

    - name: Run repo hygiene checks
      run: |
        python scripts/check_repo_hygiene.py

    - name: Verify stable v1 API compatibility
      run: |
        make api-compatibility

    - name: Verify release governance
      run: |
        make release-governance

    - name: Verify standard-agent benchmark contract
      run: |
        make benchmark-agent-quality-contract

    - name: Verify flagship benchmark contract
      run: |
        make benchmark-flagship-contract

    - name: Verify distributed async benchmark contract
      run: |
        make benchmark-distributed-async-contract

    - name: Verify lock files are in sync with pyproject.toml
      run: |
        # pip is capped below 26 for this step only. pip-tools reaches into
        # pip's private API (`from pip._internal.utils.compat import
        # stdlib_pkgs`), which pip 26 removed, so `pip install --upgrade pip`
        # above silently breaks every pip-tools invocation:
        #   ImportError: cannot import name 'stdlib_pkgs'
        # Verified: pip-tools 7.5.3 AND the current 7.6.0 both fail on pip
        # 26.2 and both work on pip 25.3 — so upgrading pip-tools is not a
        # fix and the cap has to be on pip. Remove this once a pip-tools
        # release stops using the private import.
        pip install "pip<26" pip-tools
        make lock-check

    - name: Run publish readiness checks
      run: |
        make publish-readiness

    - name: Show publish readiness summary
      if: always()
      run: |
        if [ -f publish-readiness-summary.json ]; then
          cat publish-readiness-summary.json
        else
          echo "publish-readiness-summary.json not generated"
        fi

    - name: Ensure publish-readiness artifacts exist for upload
      if: always()
      run: |
        touch bandit-report.json
        touch pip-audit-report.json
        touch coverage.xml
        touch publish-readiness-summary.json

    - name: Upload publish readiness artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: publish-readiness-reports
        path: |
          bandit-report.json
          pip-audit-report.json
          coverage.xml
          publish-readiness-summary.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Run repo hygiene checks
      run: |
        python scripts/check_repo_hygiene.py

    - name: Run linting
      run: |
        ruff check .
        black --check .
        isort --check-only .

    - name: Run pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Run type checking
      run: |
        mypy --config-file mypy.ini

    - name: Run tests
      # Coverage threshold (`fail_under`) is set in pyproject.toml's
      # [tool.coverage.report] section — pytest-cov reads it automatically.
      env:
        PYTHONFAULTHANDLER: '1'
        STATESET_DISTRIBUTED_CONTRACT_REPORT_DIR: ${{ runner.temp }}/native-ddp-contract
      run: |
        pytest --cov=stateset_agents --cov-report=xml --cov-report=term --junitxml=pytest-linux-${{ matrix.python-version }}.xml

    - name: Coverage ratchet
      # fail_under tracks the measured floor, never an aspiration. When
      # measured coverage exceeds the floor by >= 1 full point, this step
      # fails so the floor gets raised in the same PR that earned it —
      # making coverage monotonic instead of policy-only.
      if: matrix.python-version == '3.11'
      run: |
        python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        try:
            import tomllib
        except ImportError:
            import tomli as tomllib

        with open("pyproject.toml", "rb") as fh:
            floor = tomllib.load(fh)["tool"]["coverage"]["report"]["fail_under"]
        measured = float(ET.parse("coverage.xml").getroot().attrib["line-rate"]) * 100
        print(f"measured={measured:.2f} floor={floor}")
        if measured >= floor + 1:
            print(
                f"::error::Coverage is {measured:.2f}%, more than 1 point above "
                f"the fail_under floor of {floor}. Raise fail_under in "
                f"pyproject.toml to {int(measured)} so the gain is locked in."
            )
            sys.exit(1)
        PY

    - name: Run example-testing patterns (examples/testing/)
      run: |
        pytest examples/testing/ -q --no-header

    - name: Run getting-started smoke against source tree
      # Exercises examples/getting_started/smoke.sh against the checked-out
      # source (already installed via `pip install -e .` above), not the
      # published PyPI package. The Makefile's `getting-started-smoke`
      # target still runs against the installed PyPI release separately
      # for release checks — this step is a fast, always-on source-tree
      # regression check.
      run: |
        PYTHON=python examples/getting_started/smoke.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Retain Linux test and distributed worker results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-tests-${{ matrix.python-version }}
        path: |
          pytest-linux-${{ matrix.python-version }}.xml
          ${{ runner.temp }}/native-ddp-contract
        if-no-files-found: warn

  test-windows:
    runs-on: windows-latest
    # The full ~4.7k-test suite can take about 42 minutes on hosted Windows,
    # plus roughly four minutes for setup. Keep a bounded timeout with enough
    # headroom for normal runner variance and post-test cleanup.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Run tests
      run: |
        pytest -v --tb=short --junitxml=pytest-windows-${{ matrix.python-version }}.xml

    - name: Retain Windows test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-tests-${{ matrix.python-version }}
        path: pytest-windows-${{ matrix.python-version }}.xml
        if-no-files-found: warn

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run strict security scan
      run: |
        make security-scan-strict

    - name: Upload security reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Build documentation
      run: |
        pip install sphinx sphinx-rtd-theme
        sphinx-build docs docs/_build/html

    - name: Upload documentation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: documentation
        path: docs/_build/html/

  helm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.19.5

    - name: Helm lint
      run: |
        helm lint deployment/helm/stateset-agents

    - name: Helm template (default)
      run: |
        helm template stateset-agents deployment/helm/stateset-agents \
          --namespace stateset-agents \
          > /tmp/stateset-agents-rendered.yaml
        test -s /tmp/stateset-agents-rendered.yaml

    - name: Helm template (all published profiles)
      run: |
        # Renders every values-*.yaml under deployment/helm/stateset-agents/ so
        # chart drift breaks CI for any published profile, not just the GPU set.
        set -e
        chart_dir=deployment/helm/stateset-agents
        out_dir=/tmp/stateset-agents-rendered
        mkdir -p "$out_dir"
        shopt -s nullglob
        for vf in "$chart_dir"/values-*.yaml; do
          profile=$(basename "$vf" .yaml)
          echo "::group::helm template $profile"
          helm template stateset-agents "$chart_dir" \
            -f "$vf" \
            --namespace stateset-agents \
            > "$out_dir/$profile.yaml"
          test -s "$out_dir/$profile.yaml"
          echo "::endgroup::"
        done
        # Render count must match the number of values files committed.
        rendered_profiles=("$out_dir"/*.yaml)
        committed_profiles=("$chart_dir"/values-*.yaml)
        rendered=${#rendered_profiles[@]}
        committed=${#committed_profiles[@]}
        test "$committed" -gt 0
        test "$rendered" -eq "$committed" || { \
          echo "::error:: rendered $rendered profile(s), expected $committed" >&2; exit 1; }
        echo "Rendered $rendered Helm profiles successfully."

    - name: Upload rendered manifests
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: helm-rendered-manifests
        path: /tmp/stateset-agents-rendered/
        retention-days: 7
