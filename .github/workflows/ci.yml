name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  publish-readiness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"
        pip install bandit safety build twine

    - name: Run repo hygiene checks
      run: |
        python scripts/check_repo_hygiene.py

    - name: Verify lock files are in sync with pyproject.toml
      run: |
        # pip is capped below 26 for this step only. pip-tools reaches into
        # pip's private API (`from pip._internal.utils.compat import
        # stdlib_pkgs`), which pip 26 removed, so `pip install --upgrade pip`
        # above silently breaks every pip-tools invocation:
        #   ImportError: cannot import name 'stdlib_pkgs'
        # Verified: pip-tools 7.5.3 AND the current 7.6.0 both fail on pip
        # 26.2 and both work on pip 25.3 — so upgrading pip-tools is not a
        # fix and the cap has to be on pip. Remove this once a pip-tools
        # release stops using the private import.
        pip install "pip<26" pip-tools
        make lock-check

    - name: Run publish readiness checks
      run: |
        make publish-readiness

    - name: Show publish readiness summary
      if: always()
      run: |
        if [ -f publish-readiness-summary.json ]; then
          cat publish-readiness-summary.json
        else
          echo "publish-readiness-summary.json not generated"
        fi

    - name: Ensure publish-readiness artifacts exist for upload
      if: always()
      run: |
        touch bandit-report.json
        touch safety-report.json
        touch coverage.xml
        touch publish-readiness-summary.json

    - name: Upload publish readiness artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: publish-readiness-reports
        path: |
          bandit-report.json
          safety-report.json
          coverage.xml
          publish-readiness-summary.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Run repo hygiene checks
      run: |
        python scripts/check_repo_hygiene.py

    - name: Run linting
      run: |
        ruff check .
        black --check .
        isort --check-only .

    - name: Run pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Run type checking
      run: |
        mypy --config-file mypy.ini

    - name: Run tests
      # Coverage threshold (`fail_under`) is set in pyproject.toml's
      # [tool.coverage.report] section — pytest-cov reads it automatically.
      run: |
        pytest --cov=stateset_agents --cov-report=xml --cov-report=term

    - name: Coverage ratchet
      # fail_under tracks the measured floor, never an aspiration. When
      # measured coverage exceeds the floor by >= 1 full point, this step
      # fails so the floor gets raised in the same PR that earned it —
      # making coverage monotonic instead of policy-only.
      if: matrix.python-version == '3.11'
      run: |
        python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        try:
            import tomllib
        except ImportError:
            import tomli as tomllib

        with open("pyproject.toml", "rb") as fh:
            floor = tomllib.load(fh)["tool"]["coverage"]["report"]["fail_under"]
        measured = float(ET.parse("coverage.xml").getroot().attrib["line-rate"]) * 100
        print(f"measured={measured:.2f} floor={floor}")
        if measured >= floor + 1:
            print(
                f"::error::Coverage is {measured:.2f}%, more than 1 point above "
                f"the fail_under floor of {floor}. Raise fail_under in "
                f"pyproject.toml to {int(measured)} so the gain is locked in."
            )
            sys.exit(1)
        PY

    - name: Run example-testing patterns (examples/testing/)
      run: |
        pytest examples/testing/ -q --no-header

    - name: Run getting-started smoke against source tree
      # Exercises examples/getting_started/smoke.sh against the checked-out
      # source (already installed via `pip install -e .` above), not the
      # published PyPI package. The Makefile's `getting-started-smoke`
      # target still runs against the installed PyPI release separately
      # for release checks — this step is a fast, always-on source-tree
      # regression check.
      run: |
        PYTHON=python examples/getting_started/smoke.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Run tests
      run: |
        pytest --tb=short

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run strict security scan
      run: |
        make security-scan-strict

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Build documentation
      run: |
        pip install sphinx sphinx-rtd-theme
        sphinx-build docs docs/_build/html

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html/

  helm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.19.5

    - name: Helm lint
      run: |
        helm lint deployment/helm/stateset-agents

    - name: Helm template (default)
      run: |
        helm template stateset-agents deployment/helm/stateset-agents \
          --namespace stateset-agents \
          > /tmp/stateset-agents-rendered.yaml
        test -s /tmp/stateset-agents-rendered.yaml

    - name: Helm template (all published profiles)
      run: |
        # Renders every values-*.yaml under deployment/helm/stateset-agents/ so
        # chart drift breaks CI for any published profile, not just the GPU set.
        set -e
        chart_dir=deployment/helm/stateset-agents
        out_dir=/tmp/stateset-agents-rendered
        mkdir -p "$out_dir"
        shopt -s nullglob
        for vf in "$chart_dir"/values-*.yaml; do
          profile=$(basename "$vf" .yaml)
          echo "::group::helm template $profile"
          helm template stateset-agents "$chart_dir" \
            -f "$vf" \
            --namespace stateset-agents \
            > "$out_dir/$profile.yaml"
          test -s "$out_dir/$profile.yaml"
          echo "::endgroup::"
        done
        # Render count must match the number of values files committed.
        rendered=$(ls "$out_dir"/*.yaml | wc -l)
        committed=$(ls "$chart_dir"/values-*.yaml | wc -l)
        test "$rendered" -eq "$committed" || { \
          echo "::error:: rendered $rendered profile(s), expected $committed" >&2; exit 1; }
        echo "Rendered $rendered Helm profiles successfully."

    - name: Upload rendered manifests
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: helm-rendered-manifests
        path: /tmp/stateset-agents-rendered/
        retention-days: 7
