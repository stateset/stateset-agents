name: Training contracts

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', extra: minimal, dependencies: latest}
          - {python: '3.13', extra: minimal, dependencies: latest}
          - {python: '3.12', extra: api, dependencies: latest}
          - {python: '3.12', extra: workers, dependencies: latest}
          - {python: '3.10', extra: training, dependencies: minimum}
          - {python: '3.12', extra: training, dependencies: latest}
          - {python: '3.12', extra: training, dependencies: locked}
          - {python: '3.12', extra: training, dependencies: runtime-locked}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir /tmp/wheels
      - name: Install wheel in a clean environment
        env:
          EXTRA: ${{ matrix.extra }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          wheel=$(find /tmp/wheels -name '*.whl' -print -quit)
          if [ "$DEPENDENCIES" = locked ]; then
            /tmp/wheel-env/bin/pip install -r requirements-dev-lock.txt
            /tmp/wheel-env/bin/pip install --no-deps "$wheel"
          elif [ "$DEPENDENCIES" = runtime-locked ]; then
            /tmp/wheel-env/bin/pip install -r requirements-training-lock.txt
            /tmp/wheel-env/bin/pip install --no-deps "$wheel"
          elif [ "$DEPENDENCIES" = minimum ]; then
            /tmp/wheel-env/bin/pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            /tmp/wheel-env/bin/pip install "${wheel}[$EXTRA]" transformers==4.57.1 peft==0.18.0 trl==0.14.0
          elif [ "$EXTRA" = minimal ]; then
            /tmp/wheel-env/bin/pip install "$wheel"
          else
            /tmp/wheel-env/bin/pip install "${wheel}[$EXTRA]"
          fi
          /tmp/wheel-env/bin/pip check
          cp scripts/verify_installed_wheel.py /tmp/verify_installed_wheel.py
          cd /tmp
          /tmp/wheel-env/bin/python verify_installed_wheel.py --extra "$EXTRA"
      - name: Exercise installed wheel policy updates and exact resume
        if: matrix.extra == 'training'
        env:
          OMP_NUM_THREADS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          cp benchmarks/offline_policy_device_contract.py /tmp/offline_policy_device_contract.py
          cd /tmp
          /tmp/wheel-env/bin/python offline_policy_device_contract.py --device cpu --output /tmp/wheel-device-contract
      - uses: actions/upload-artifact@v7
        if: always() && matrix.extra == 'training'
        with:
          name: wheel-device-contract-${{ matrix.python }}-${{ matrix.dependencies }}
          path: /tmp/wheel-device-contract/device_contract.json

  muse-spark-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATESET_REQUIRE_MUSE_RUNTIME: '1'
      STATESET_REQUIRE_FRONTIER_RUNTIME: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU-only Muse training runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[muse-spark,frontier]' pytest pytest-asyncio pytest-xdist pytest-timeout
      - name: Verify real tiny MoE adapter updates and SFT loss masks
        run: >-
          pytest -n 0 -o addopts=''
          tests/unit/test_muse_spark.py
          tests/integration/test_muse_spark_architecture.py
          tests/unit/test_frontier_models.py
          tests/unit/test_deepseek_v41_1017.py
          tests/unit/test_remote_model_catalog.py
          tests/integration/test_frontier_architectures.py
          tests/integration/test_frontier_fp8.py
          tests/unit/test_text_sft.py
          tests/unit/test_distributed_preflight.py
          tests/integration/test_sft_rank_consensus.py
          tests/integration/test_frontier_tokenizers.py

  native-ddp-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      STATESET_DISTRIBUTED_CONTRACT_REPORT_DIR: /tmp/native-ddp-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[training]' pytest pytest-asyncio pytest-xdist pytest-timeout
      - name: Verify real two-worker RL normalization and accumulation
        run: >-
          pytest -n 0 -o addopts='' --timeout=140
          tests/integration/test_distributed_grpo_weighting.py
          tests/integration/test_distributed_advantages.py
          tests/integration/test_learner_preflight.py
          tests/integration/test_replica_consensus.py
          tests/integration/test_native_ddp_checkpoint.py
          tests/integration/test_ddp_checkpoint_publication.py
          tests/integration/test_ddp_evaluation.py
          tests/integration/test_ddp_continual.py
          tests/integration/test_ddp_empty_population.py
          tests/integration/test_ddp_training_loop.py
          tests/integration/test_ddp_rollout_metrics.py
          tests/integration/test_ddp_diagnostics.py
          tests/integration/test_ddp_optimizer_reporting.py
          tests/unit/test_optimizer_update_reporting.py
          tests/unit/test_training_diagnostics.py
          tests/unit/test_learning_state_recovery.py
          tests/unit/test_rollout_metrics.py
          tests/unit/test_wandb_logger.py
          tests/unit/test_ddp_population.py
          tests/unit/test_ddp_checkpoint_state.py
          tests/unit/test_ddp_evaluation.py
          tests/unit/test_ddp_continual.py
          tests/unit/test_grpo_scheduler_budget.py
          tests/unit/test_distributed_advantages.py
          tests/unit/test_learner_preflight.py
          tests/unit/test_implementation_identity.py
          tests/unit/test_state_fingerprint.py
          tests/unit/test_scheduler_identity.py
          tests/unit/test_metric_reduction.py
          tests/unit/test_token_group_aggregation.py
          tests/unit/test_online_accumulation_weighting.py
          tests/unit/test_grpo_inner_updates.py
          tests/unit/test_partial_accumulation_mean.py
          tests/unit/test_grpo_accumulation_transitions.py
          tests/unit/test_distributed_accelerate.py
          tests/unit/test_multi_turn_training_lifecycle.py
          tests/unit/test_training_profiling.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ddp-cpu-contract
          path: /tmp/native-ddp-contract

  sampled-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev-lock.txt
      - run: pip install -e . --no-deps
      - name: Verify reward and model identity contracts
        run: pytest -n 0 -o addopts='' tests/unit/test_reward_wrapper_contracts.py tests/unit/test_model_revision_pinning.py
      - name: Verify support reward recovery and independent checkpoint selection
        run: >-
          pytest -n 0 -o addopts=''
          tests/unit/test_support_conversation_reward.py
          tests/unit/test_support_conversation_reward_v3.py
          tests/unit/test_support_judge.py
          tests/unit/test_support_reward_recovery.py
          tests/unit/test_support_recovery_evidence.py
          tests/unit/test_finetune_studio.py
          tests/unit/test_finetune_inspection.py
          tests/unit/test_finetune_failures.py
          tests/unit/test_cli_finetune.py
          tests/unit/test_cli_finetune_records.py
          tests/unit/test_finetune_handoff.py
          tests/unit/test_finetune_backends.py
          tests/unit/test_finetune_validation.py
          tests/unit/test_finetune_logs.py
          tests/unit/test_finetune_comparison.py
          tests/unit/test_finetune_dataset.py
          tests/unit/test_finetune_quality.py
          tests/unit/test_finetune_recovery.py
          tests/unit/test_finetune_evaluation.py
          tests/unit/test_evaluation_case_picker.py
          tests/unit/test_finetune_checkpoint_evaluation.py
          tests/unit/test_finetune_seeds.py
          tests/unit/test_finetune_validation_comparison.py
          tests/unit/test_finetune_nomination.py
          tests/unit/test_finetune_nomination_history.py
          tests/unit/test_finetune_mobile.py
          tests/unit/test_finetune_worker_ownership.py
          tests/unit/test_finetune_worker_terminal.py
          tests/unit/test_finetune_interrupted_stop.py
          tests/unit/test_checkpoint_rng_publication.py
          tests/unit/test_native_checkpoint_metadata.py
          tests/unit/test_native_checkpoint_safety.py
          tests/unit/test_resume_rollout_sync.py
          tests/unit/test_multi_turn_trainer.py
          tests/unit/test_runtime_checkpoint_safety.py
          tests/unit/test_runtime_state.py
          tests/unit/test_dedicated_entrypoint_resume.py
          tests/unit/test_training_resume_required.py
          tests/unit/test_ppo_safety.py
          tests/unit/test_ppo_objective.py
          tests/unit/test_remote_runpod_executor.py
          tests/api/test_finetune_operator.py
      - name: Verify image-conditioned Nemotron contracts
        run: |
          pip install 'pillow>=10.0.0'
          pytest -n 0 -o addopts='' tests/unit/test_nemotron_vl.py
      - name: Verify logged-policy improvement contracts
        run: >-
          pytest -n 0 -o addopts=''
          tests/unit/test_offline_policy_training.py
          tests/unit/test_logged_transition_semantics.py
          tests/unit/test_training_diagnostics.py
          tests/unit/test_training_profiling.py
          tests/unit/test_production_curation.py
          tests/unit/test_policy_promotion.py
          tests/unit/test_improvement_pipeline.py
          tests/unit/test_preset_training_contracts.py
          tests/unit/test_token_group_aggregation.py
          tests/unit/test_online_accumulation_weighting.py
          tests/unit/test_learning_state_recovery.py
          tests/unit/test_ewc_estimation.py
          tests/unit/test_native_evaluation_isolation.py
          tests/unit/test_evaluation_integrity.py
      - run: python -m stateset_agents.training.sampled_workflow --output /tmp/sampled-workflow --seeds 42 43 44
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sampled-workflow
          path: /tmp/sampled-workflow

  durable-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STATESET_TEST_QUEUE_DSN: postgresql://postgres:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev-lock.txt
      - run: pip install -e '.[workers]' --no-deps
      - run: pip install 'psycopg[binary]==3.3.6'
      - run: pytest -n 0 -o addopts='' tests/unit/test_training_queue.py tests/api/test_durable_training_worker.py tests/api/test_training_queue_async.py tests/unit/test_runtime_state.py tests/unit/test_training_contracts.py
