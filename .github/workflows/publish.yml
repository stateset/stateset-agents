name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Publish environment (workflow_dispatch only)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      run_readiness_gate:
        description: 'Run the heavy publish-readiness gate (bandit/safety/coverage) before publishing'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ (github.event_name == 'release' || github.event_name == 'push') && 'pypi' || github.event.inputs.environment }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-publish-${{ hashFiles('**/pyproject.toml') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"
        pip install bandit safety
        pip install build twine

    - name: Verify Version Matches Release/Tag
      if: github.event_name == 'release' || github.event_name == 'push'
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        TAG="${TAG#v}"

        PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"

        echo "Tag version: ${TAG}"
        echo "pyproject.toml version: ${PKG_VERSION}"
        if [ "${PKG_VERSION}" != "${TAG}" ]; then
          echo "Version mismatch: tag=${TAG} pyproject=${PKG_VERSION}"
          exit 1
        fi

    - name: Build distribution
      run: |
        rm -rf dist/
        python -m build --sdist --wheel

    - name: Check distribution with twine
      run: |
        twine check dist/*

    - name: Install-smoke test built wheel
      run: |
        set -euo pipefail
        python -m venv /tmp/publish-smoke-venv
        /tmp/publish-smoke-venv/bin/pip install --upgrade pip
        # pyyaml is a core dependency (preset files ship as YAML and are
        # runtime-loaded even on a bare install), so this exercises the real
        # preset-loading path on a plain `pip install dist/*.whl` with no
        # extras — no separate pyyaml install needed.
        /tmp/publish-smoke-venv/bin/pip install dist/*.whl
        /tmp/publish-smoke-venv/bin/python -c "import stateset_agents; print('version:', stateset_agents.__version__); from stateset_agents.config import get_agent_preset; preset = get_agent_preset('customer_service'); assert preset, 'preset failed to load'; print('preset keys:', sorted(preset.keys()))"

    - name: Run publish readiness checks (optional, non-blocking)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_readiness_gate == 'true'
      continue-on-error: true
      run: |
        make publish-readiness

    - name: Show publish readiness summary
      if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_readiness_gate == 'true'
      run: |
        if [ -f publish-readiness-summary.json ]; then
          cat publish-readiness-summary.json
        else
          echo "publish-readiness-summary.json not generated"
        fi

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}

    - name: Publish to PyPI (OIDC trusted publishing)
      if: (github.event_name == 'release' || github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        # Prefer OIDC trusted publishing (no password needed). Falls back to the
        # PYPI_API_TOKEN secret only if it has been configured, e.g. before the
        # PyPI trusted-publisher relationship is set up.
        password: ${{ secrets.PYPI_API_TOKEN != '' && secrets.PYPI_API_TOKEN || '' }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event.inputs.environment == 'pypi' || github.event_name == 'release' || github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta_api
      uses: docker/metadata-action@v5
      with:
        images: stateset/stateset-agents-api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push gateway image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployment/docker/Dockerfile
        target: runtime
        push: true
        tags: ${{ steps.meta_api.outputs.tags }}
        labels: ${{ steps.meta_api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata (trainer)
      id: meta_trainer
      uses: docker/metadata-action@v5
      with:
        images: stateset/stateset-agents-trainer
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push trainer image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployment/docker/Dockerfile.trainer
        push: true
        tags: ${{ steps.meta_trainer.outputs.tags }}
        labels: ${{ steps.meta_trainer.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docs-publish:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event.inputs.environment == 'pypi' || github.event_name == 'release' || github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        sphinx-build docs docs/_build/html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        cname: docs.stateset.ai
