name: Publish

on:
  # A tag is the single production-release event. A GitHub Release is created
  # from the verified artifacts below; listening for `release: published` as
  # well would run the entire publication pipeline twice for the same version.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Publish environment (workflow_dispatch only)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

# Least privilege by default; each job below grants only the extra scopes it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    # OIDC here is scoped to artifact provenance. Package publication remains
    # isolated in pypi-publish with its own environment and permissions.
    # `environment` stays because the TestPyPI upload step below reads
    # secrets.TEST_PYPI_API_TOKEN, which is scoped to the environment.
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || github.event.inputs.environment }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-publish-${{ hashFiles('**/pyproject.toml') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"
        pip install bandit pip-audit
        pip install build twine

    - name: Verify Version Matches Release/Tag
      if: github.event_name == 'push'
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF#refs/tags/}"
        TAG="${TAG#v}"

        PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"

        echo "Tag version: ${TAG}"
        echo "pyproject.toml version: ${PKG_VERSION}"
        if [ "${PKG_VERSION}" != "${TAG}" ]; then
          echo "Version mismatch: tag=${TAG} pyproject=${PKG_VERSION}"
          exit 1
        fi

    - name: Run mandatory publish readiness gate
      run: make publish-readiness

    - name: Upload publish readiness evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: publish-readiness-${{ github.sha }}
        path: |
          publish-readiness-summary.json
          bandit-report.json
          pip-audit-report.json
          coverage.xml
        if-no-files-found: warn

    - name: Build distribution
      run: |
        rm -rf dist/
        python -m build --sdist --wheel

    - name: Check distribution with twine
      run: |
        twine check dist/*

    - name: Upload dist artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

    - name: Install-smoke test built wheel
      run: |
        set -euo pipefail
        python -m venv /tmp/publish-smoke-venv
        /tmp/publish-smoke-venv/bin/pip install --upgrade pip
        # pyyaml is a core dependency (preset files ship as YAML and are
        # runtime-loaded even on a bare install), so this exercises the real
        # preset-loading path on a plain `pip install dist/*.whl` with no
        # extras — no separate pyyaml install needed.
        /tmp/publish-smoke-venv/bin/pip install dist/*.whl
        /tmp/publish-smoke-venv/bin/python -c "import stateset_agents; print('version:', stateset_agents.__version__); from stateset_agents.config import get_agent_preset; preset = get_agent_preset('customer_service'); assert preset, 'preset failed to load'; print('preset keys:', sorted(preset.keys()))"

    - name: Attest Python distributions
      if: github.event_name == 'push'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  # Isolated into its own job so a PyPI failure (e.g. the trusted-publisher
  # misconfiguration on pypi.org) can't block docker-publish/docs-publish,
  # which only depend on `publish` (build + twine-check), not on this job.
  pypi-publish:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || github.event.inputs.environment }}

    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI (OIDC or scoped API token)
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
      with:
        skip-existing: true
        # An empty password selects OIDC trusted publishing. A configured,
        # project-scoped token is an explicit fallback while the PyPI trusted
        # publisher relationship is being repaired.
        password: ${{ secrets.PYPI_API_TOKEN != '' && secrets.PYPI_API_TOKEN || '' }}

  npm-publish:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
        node-version: "24"
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    - name: Install OIDC-capable npm CLI
      run: npm install --global npm@11.15.0

    - name: Verify npm version matches tag
      working-directory: npm
      run: |
        set -euo pipefail
        tag_version="${GITHUB_REF_NAME#v}"
        package_version="$(node -p "require('./package.json').version")"
        test "${package_version}" = "${tag_version}"

    - name: Test npm package
      working-directory: npm
      run: |
        npm ci
        npm test
        npm run pack:check

    - name: Determine npm publish auth mode
      shell: bash
      run: |
        if [ -z "${NPM_TOKEN:-}" ]; then
          echo "Using GitHub OIDC trusted publishing (no NPM_TOKEN configured)."
        else
          echo "Using scoped NPM token fallback (NPM_TOKEN is configured)."
        fi

    - name: Publish npm package with trusted publishing
      if: env.NPM_TOKEN == ''
      working-directory: npm
      shell: bash
      run: |
        set -euo pipefail
        echo "Attempting npm publish with GitHub OIDC (trusted publishing)…"
        package_name="$(node -p "require('./package.json').name")"
        # Trusted publishing can only publish *new versions* of a package that
        # already exists on the registry with this repository linked as its
        # trusted publisher; it cannot create the package. Diagnose that
        # precisely instead of a generic 404 from PUT.
        if ! npm view "${package_name}" version >/dev/null 2>&1; then
          echo "::error::${package_name} does not exist on registry.npmjs.org yet. Trusted publishing cannot create a package: publish the first version with an npm automation token (add the NPM_TOKEN repository secret, scoped to the @stateset org, and re-run this workflow), then link this repository as the package's trusted publisher on npmjs.com (package Settings → Publishing access) so later releases publish via OIDC without the token."
          exit 1
        fi
        # whoami is best-effort — it can fail before publish acquires an id-token.
        npm whoami || true
        if ! npm publish --access public; then
          echo "::error::npm publish failed for ${package_name}. The package exists, so link this GitHub repository (workflow publish.yml) as its trusted publisher on npmjs.com (package Settings → Publishing access) and re-run; or add an NPM_TOKEN repository secret (automation token scoped to @stateset) to fall back to token mode."
          exit 1
        fi

    - name: Publish npm package with scoped token fallback
      if: env.NPM_TOKEN != ''
      working-directory: npm
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: npm publish --access public --provenance

  github-release:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Download verified distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Create or refresh GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber \
            --repo "${GITHUB_REPOSITORY}"
        else
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
        fi

  docker-publish:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      # Pushes to Docker Hub with repository secrets; the GHA cache backend
      # uses the runtime token, so only read access to the repo is required.
      contents: read
    if: github.event.inputs.environment == 'pypi' || github.event_name == 'push'

    # GitHub does not allow `secrets.*` in a job-level `if`, so the credentials
    # are lifted into `env` (which job steps *can* test) and every Docker step
    # is guarded on them. Without this the job died on docker/login-action with
    # "Username and password required" on every release, because
    # DOCKER_USERNAME / DOCKER_PASSWORD are not configured on this repo.
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - name: Report missing Docker Hub credentials
      if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
      run: |
        echo "::warning::Skipping the Docker image publish: the DOCKER_USERNAME and DOCKER_PASSWORD repository secrets are not configured. Set both under Settings > Secrets and variables > Actions (DOCKER_PASSWORD should be a Docker Hub access token with Read/Write scope for the stateset/* repositories), then re-run this workflow to publish the images."

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''

    - name: Set up Docker Buildx
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Docker Hub
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta_api
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: stateset/stateset-agents-api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push gateway image
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./deployment/docker/Dockerfile
        target: runtime
        push: true
        tags: ${{ steps.meta_api.outputs.tags }}
        labels: ${{ steps.meta_api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true

    - name: Extract metadata (trainer)
      id: meta_trainer
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: stateset/stateset-agents-trainer
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push trainer image
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./deployment/docker/Dockerfile.trainer
        push: true
        tags: ${{ steps.meta_trainer.outputs.tags }}
        labels: ${{ steps.meta_trainer.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true

  docs-publish:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event.inputs.environment == 'pypi' || github.event_name == 'push'
    permissions:
      # peaceiris/actions-gh-pages pushes the built site to the gh-pages branch.
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        sphinx-build docs docs/_build/html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        cname: docs.stateset.ai
