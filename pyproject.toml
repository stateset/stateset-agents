[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stateset-agents"
version = "0.69.0"
description = "Production-ready RL framework for training multi-turn conversational AI agents using GRPO and GSPO"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "StateSet Team", email = "team@stateset.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "typing-extensions>=4.0.0",
    "tqdm>=4.65.0",
    "cachetools>=5.0.0",
    # Runtime-loaded YAML presets (e.g. starter/training configs) ship in
    # the wheel and are read even on a bare install.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
workers = [
    "stateset-agents[api]",
    "psycopg[binary]>=3.1,<4",
]
river = [
    # River's SDK requires Python >=3.12; this extra is opt-in.
    "river-client>=0.11.0,<0.12",
]
dev = [
    # NOTE: [dev] must be a superset of [training] and [api] — CI installs
    # ".[dev,api]" and the dev lock is compiled from these extras. A
    # self-referential "stateset-agents[training]" spec would be cleaner but
    # sends pip-compile's resolver into ResolutionTooDeepError, so the deps
    # are listed explicitly and tests/unit/test_pyproject_extras.py enforces
    # the superset relation instead.
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    # pytest.ini addopts hard-requires these (-n auto --dist loadfile and
    # --timeout=60).
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.4.0,<3.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0",
    # CI runs this formatter directly, so pin it like mypy instead of letting
    # a new major version redefine the merge gate without review.
    "isort==8.0.1",
    "flake8>=6.0.0",
    # Pinned exactly (not a floor): CI installs unpinned via
    # `pip install -e ".[dev,api]"`, so a bare floor here means every
    # mypy release automatically becomes CI's type-check gate the moment
    # it ships -- which is how round 3 broke on mypy going 2.1 -> 2.3 and
    # round 4 broke again on stricter/changed inference in the same 2.x
    # line. Bump this deliberately (and re-verify `mypy --config-file
    # mypy.ini` + `check_types.py --all`) rather than letting it drift.
    "mypy==2.3.0",
    # Pinned upper bound (not just dev-only in spirit, but scoped here
    # since mypy is the thing that breaks): numpy 2.5.0 shipped inline
    # .pyi stubs using PEP 695 `type X = ...` syntax, which mypy refuses
    # to parse under mypy.ini's `python_version = 3.10` target ("Type
    # statement is only supported in Python 3.12 and greater"), crashing
    # every mypy invocation before it checks a single line of our code.
    # 2.4.0 is the newest release confirmed still using pre-PEP-695 stub
    # syntax; capping here (rather than bumping mypy.ini's python_version,
    # which would also start allowing our own curated files to use
    # 3.11/3.12-only syntax the project's actual minimum-supported
    # Python -- 3.10 -- can't run) keeps that floor meaningful.
    "numpy<2.5.0",
    "pre-commit>=3.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.10.1,<3.0.0",
    # Semgrep is not a [dev] dependency: upstream pins mcp==1.29.0
    # (CVE-2026-59951), which would put a vulnerable SDK in this lock. CI's
    # security jobs install it in their own step; locally use
    # `pipx run semgrep` (or `pipx install semgrep`). See SECURITY.md.
    # Test-only dependencies that used to arrive transitively via Semgrep:
    # secret-encryption tests (cryptography) and schema validation tests.
    "cryptography>=46.0.0",
    "jsonschema>=4.23.0",
    "pip-tools>=7.0.0",
    "torch>=2.6.0,<3",
    "transformers>=4.57.1",
    "datasets>=5.0.1",
    "accelerate>=1.15.0",
    "wandb>=0.15.0",
    "peft>=0.18.0,<1",
    "trl>=0.14.0,<2.0.0",
    "aiohttp>=3.14.5",
    "certifi>=2026.10.19",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "gymnasium>=0.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0,<0.28.0",
    "requests>=2.31.0",
    "redis>=4.5.0",
    "PyJWT>=2.15.0,<3.0.0",
]
training = [
    "torch>=2.6.0,<3",
    "transformers>=4.57.1",
    "datasets>=5.0.1",
    "accelerate>=1.15.0",
    "wandb>=0.15.0",
    "peft>=0.18.0,<1",
    "trl>=0.14.0,<2.0.0",
    "aiohttp>=3.14.5",
    "certifi>=2026.10.19",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "gymnasium>=0.28.0",
]
nemotron-vl = [
    "stateset-agents[training]",
    "transformers>=5.14.1",
    "accelerate>=1.15.0",
    "pillow>=10.0.0",
    "packaging>=23.0",
]
frontier = [
    "stateset-agents[training]",
    "torch>=2.7.0,<3",
    "transformers>=5.20.0",
    "trl>=1.14.0,<2",
    "peft>=0.21.0,<1",
    "accelerate>=1.15.0",
    "packaging>=23.0",
]
muse-spark = [
    "stateset-agents[training]",
    "torch>=2.7.0,<3",
    "transformers>=5.20.0",
    "trl>=1.14.0,<2",
    "peft>=0.21.0,<1",
    "accelerate>=1.15.0",
    "packaging>=23.0",
]
small-models = [
    "stateset-agents[training]",
    "transformers>=5.5.0",
    "peft>=0.18.0",
    "bitsandbytes>=0.49.0",
    "mistral-common>=1.8.6",
]
gemma4 = [
    "stateset-agents[training]",
    # Gemma4ForConditionalGeneration ships in Transformers 5.5.
    "transformers>=5.5.0",
    "peft>=0.18.0",
    "bitsandbytes>=0.49.0",
]
glm53 = [
    "stateset-agents[training]",
    # The official checkpoint declares transformers_version 5.16.0 and uses
    # Glm5NextForConditionalGeneration / AutoModelForMultimodalLM.
    "transformers>=5.16.0",
]
qwen38next = [
    "stateset-agents[training]",
    # Qwen4ExpForConditionalGeneration and the composite multimodal auto class
    # first appear in the Transformers generation recorded by the checkpoint.
    "transformers>=5.8.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    # Starlette/FastAPI's TestClient is not compatible with httpx>=0.28 yet.
    "httpx>=0.25.0,<0.28.0",
    # Used by performance monitoring endpoints.
    "psutil>=5.9.0",
    # Used by alerting integrations.
    "requests>=2.31.0",
    "certifi>=2026.10.19",
    # Optional: distributed cache and cross-pod rate limiting
    # (API_RATE_LIMIT_BACKEND=redis). The API works without it, falling
    # back to the in-memory limiter/cache if redis is not installed or
    # unreachable.
    "redis>=4.5.0",
    "PyJWT>=2.15.0,<3.0.0",
]
examples = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "langchain>=0.1.0",
]
trl = [
    "trl>=0.14.0,<2.0.0",
    "bitsandbytes>=0.41.0",
]
qlora = [
    # 4-bit/8-bit (QLoRA) base-model loading: `python -m
    # stateset_agents.training.sft --quantization 4bit` and
    # stateset_agents.training.quantization. bitsandbytes' k-bit kernels need
    # a CUDA GPU; CPU hosts keep dry runs and get an actionable error.
    "stateset-agents[training]",
    "bitsandbytes>=0.49.0",
]
eval-harness = [
    # General-capability regression checks against a local checkpoint or
    # adapter (stateset_agents.evaluation.capability_regression). Not a core
    # dependency: the module imports without it and names this extra when a
    # run is requested.
    "stateset-agents[training]",
    "lm-eval>=0.4.5,<0.5",
]
vllm = [
    "vllm>=0.18.2",
]
rust = [
    # Optional native accelerator (10–100× speedup on GAE / group-advantage /
    # GSPO ratio paths). Pure-Rust extension built via maturin; the Python
    # framework gracefully falls back to NumPy when this is not installed.
    # Build/publish lives in .github/workflows/rust-wheels.yml; release on
    # the rust-core-v* tag namespace, independent of stateset-agents tags.
    "stateset-rl-core>=0.1.0",
]
hpo = [
    "optuna>=3.0.0",
    "ray[tune]>=2.0.0",
]
auto-research = [
    "stateset-agents[training]",
    "optuna>=3.0.0",
    "pyyaml>=6.0",
]
auto-research-llm = [
    "stateset-agents[auto-research]",
    "anthropic>=0.5.0",
    "openai>=1.0.0",
]
distributed = [
    "deepspeed>=0.9.0",
]
mcp = [
    # Official MCP Python SDK (FastMCP). Powers `stateset-agents mcp` —
    # exposes the improve/ingest/grade loop as MCP tools for any MCP client
    # (Claude Code/Desktop, other agents). Not a core dependency: only
    # installed when the `mcp` extra is requested.
    # Pinned <2: mcp 2.0.0 removed mcp.server.fastmcp.FastMCP (renamed/
    # restructured under mcp.server.mcpserver) — stick to the 1.x FastMCP
    # API this server is written against until that migration is done.
    # 1.30.0 bounds/reclaims Streamable HTTP sessions (CVE-2026-59951).
    "mcp>=1.30.0,<2",
]
remote = [
    # `stateset-agents train-remote` runs the SFT job from `improve` on
    # another machine. The base extra covers the local provider, which only
    # needs the training stack the job itself uses.
    "stateset-agents[training]",
    # RunPod's REST adapter is intentionally lightweight and talks directly
    # to the provider API rather than depending on a provider SDK.
    "requests>=2.31.0",
]
cloud = [
    # S3-compatible artifact transport shared by CoreWeave and Nebius.
    "boto3>=1.34.0",
]
coreweave = [
    "stateset-agents[remote,cloud]",
]
nebius = [
    "stateset-agents[remote,cloud]",
]
fireworks = [
    # Fireworks provider for `train-remote --provider fireworks`. Not a core
    # dependency, for the same reason as modal: the framework imports and
    # lists the provider without it, and only errors — naming this extra —
    # at submit time.
    # 1.x is the Stainless-generated typed client this adapter is written
    # against; 0.x exposed a different `fireworks.client` surface entirely.
    "fireworks-ai>=1.2",
]
huggingface = [
    "stateset-agents[remote]",
    "huggingface-hub>=1.0",
]
tinker = [
    "stateset-agents[training]",
    "tinker>=0.4.0",
]
together = [
    "together>=2.0.0",
]
prime = [
    # Prime's supported integration surface is its separately installed CLI.
    # This extra keeps the discoverable provider name symmetric with others.
]
modal = [
    # Modal provider for `train-remote --provider modal`. Not a core
    # dependency: the framework imports and lists the provider without it,
    # and only errors — naming this extra — at submit time.
    # Volume.objects.delete(), used to guarantee per-job storage cleanup,
    # landed in 1.1.2. Older SDKs can run the job but leak its named volume.
    "modal>=1.1.2",
]
full = [
    "stateset-agents[training,api,hpo,auto-research,vllm,rust,cloud]",
]

[project.urls]
Homepage = "https://github.com/stateset/stateset-agents"
Repository = "https://github.com/stateset/stateset-agents"
Documentation = "https://docs.stateset.ai"
Issues = "https://github.com/stateset/stateset-agents/issues"

[project.scripts]
stateset-agents = "stateset_agents.cli:run"
# Phase 1 rename to TraceForge RL (docs/RENAME_TRACEFORGE.md); same entry.
traceforge-rl = "stateset_agents.cli:run"

# Setuptools package discovery
[tool.setuptools.packages.find]
include = [
    "stateset_agents*",
    "traceforge_rl*",
]
exclude = [
    "tests*",
    "docs*",
    "benchmarks*",
    "scripts*",
    "htmlcov*",
    "dist*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"stateset_agents" = ["py.typed", "config/presets/**/*.yaml", "config/presets/**/*.json", "evaluation/rubrics/*.md"]
"traceforge_rl" = ["py.typed"]


# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "__pycache__"]
# B101: assert checks. B601: shell usage warnings.
# Checkpoint loading has one reviewed, locally annotated weights-only gateway.
# Keep B614 enabled everywhere else so new unsafe loaders fail the release gate.
skips = ["B101", "B601"]

# Black configuration
[tool.black]
line-length = 88
# The floor only. Black's AST safety check is *skipped* whenever the running
# interpreter is older than the highest target version, so listing py313 here
# silently disabled the check on 3.10-3.12 (CI printed "Python 3.11 cannot
# parse code formatted for Python 3.13"). py310 is the project's minimum
# supported version, so formatting for it is valid on every interpreter we
# support and the safety check runs everywhere.
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | outputs
  | benchmark_results
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["stateset_agents"]
known_third_party = ["torch", "transformers", "datasets", "numpy", "wandb"]
# Historical evidence contains frozen source snapshots; never reformat it.
extend_skip = [".claude", ".cache", "outputs", "benchmark_results"]
skip_gitignore = true

# Coverage configuration
[tool.coverage.run]
source = ["stateset_agents"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
# Source of truth for the coverage gate — pytest-cov picks this up from
# pyproject.toml, so both local `pytest --cov` and CI enforce the same floor.
#
# Ratchet policy: this number should track the *current floor*, never an
# aspirational target. When coverage rises, bump this gate in the same PR so
# the floor cannot silently regress. If your PR drops the number, you owe
# either new tests or a written justification in the PR description.
#
# History: 70 set in v0.15.1 (aspirational — silently broke the CI test
# step because measured coverage was ~54.5%); lowered to 54 to match the
# measured floor on the post-CLI-decomp tree. Async rollout coordinator,
# runtime, and evidence-gate tests raised the Python 3.11 CI measurement to
# 63.21%. Real-model streaming tests raised the Python 3.11 CI measurement
# to 64.06%. The expanded local Python 3.12 suite measured 65.80% after the
# River workflow and training-integrity additions, raising the floor to 65.
# Hosted Python 3.11 CI measured 72.55% on 2026-10-20 (run 39493579058);
# preserve that measured gain with a 72% floor. Hosted Python 3.11 CI measured
# 75.07% on 2026-10-22 (run 39742294621) after the A+ review branch; floor 75.
# Hosted Python 3.11 CI measured 76.09% after round 3 (2026-10-22); floor 76.
# Hosted Python 3.11 CI measured 77.22% after the quality consolidation and
# spine S6 (2026-10-22, run 39900144421 head 5e381a33); floor 77.
# Hosted Python 3.11 CI measured 78.47% after spine S9, distillation/online
# DPO, decontamination and the errors/layering pass (2026-10-23, head
# af310130); floor 78.
fail_under = 78
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Ruff configuration (fast Python linter)
[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.ipynb", "outputs", "benchmark_results"]
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "BLE", # flake8-blind-except; package baseline below, ratchet in
           # tests/unit/test_blind_except_ratchet.py
    "TRY002", # raise a bare Exception
    "TRY201", # `raise exc` instead of a bare `raise`
    "TRY203", # try/except that only re-raises
    "TRY401", # exception object repeated in logger.exception
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"stateset_agents/core/advanced_monitoring.py" = ["E402"]
"stateset_agents/core/agent.py" = ["E402"]
"stateset_agents/training/dapo_trainer.py" = ["E402"]
"stateset_agents/training/gspo_trainer.py" = ["E402"]
"stateset_agents/training/train.py" = ["E402"]
"stateset_agents/training/trl_grpo_trainer.py" = ["E402"]
"stateset_agents/training/vapo_trainer.py" = ["E402"]
"stateset_agents/utils/wandb_integration.py" = ["E402", "BLE001"]  # BLE001: baseline
"tests/**/*" = ["B011", "BLE001"]  # assert false; blind excepts allowed in tests
# Blind-except is a library rule: demos, benchmarks, scripts and deployment
# helpers are exempt.
"examples/**/*" = ["BLE001"]
"benchmarks/**/*" = ["BLE001"]
"scripts/**/*" = ["BLE001"]
"deployment/**/*" = ["BLE001"]
# Package files that predate BLE001. Only shrinks: lower the count in
# tests/unit/test_blind_except_ratchet.py and drop the file here at zero.
"stateset_agents/api/distributed_cache.py" = ["BLE001"]
"stateset_agents/api/main.py" = ["BLE001"]
"stateset_agents/api/middleware.py" = ["BLE001"]
"stateset_agents/api/persistence.py" = ["BLE001"]
"stateset_agents/api/routers/metrics.py" = ["BLE001"]
"stateset_agents/api/routers/training_lab.py" = ["BLE001"]
"stateset_agents/api/services/training_service.py" = ["BLE001"]
"stateset_agents/api/training_worker.py" = ["BLE001"]
"stateset_agents/cli.py" = ["BLE001"]
"stateset_agents/cli_advanced.py" = ["BLE001"]
"stateset_agents/cli_chat.py" = ["BLE001"]
"stateset_agents/cli_finetune.py" = ["BLE001"]
"stateset_agents/cli_research.py" = ["BLE001"]
"stateset_agents/evaluation/industry.py" = ["BLE001"]
"stateset_agents/evaluation/reward_audit.py" = ["BLE001"]
"stateset_agents/experimental/ppo_online.py" = ["BLE001"]
"stateset_agents/finetune_evaluation_tui.py" = ["BLE001"]
"stateset_agents/finetune_evaluation_worker.py" = ["BLE001"]
"stateset_agents/finetune_validation.py" = ["BLE001"]
"stateset_agents/finetune_worker.py" = ["BLE001"]
"stateset_agents/remote/chat_session.py" = ["BLE001"]
"stateset_agents/remote/modal.py" = ["BLE001"]
"stateset_agents/remote/river_rl_runner.py" = ["BLE001"]
"stateset_agents/remote/river_runtime.py" = ["BLE001"]
"stateset_agents/remote/runpod.py" = ["BLE001"]
"stateset_agents/remote/serve_session.py" = ["BLE001"]
"stateset_agents/rewards/nsr_verifier.py" = ["BLE001"]
"stateset_agents/rewards/symbolic_physics_reward.py" = ["BLE001"]
"stateset_agents/training/spine/loop.py" = ["BLE001"]
"stateset_agents/training/spine/update.py" = ["BLE001"]
"stateset_agents/tui.py" = ["BLE001"]
"stateset_agents/tui_tasks.py" = ["BLE001"]
"stateset_agents/utils/async_calls.py" = ["BLE001"]
"tests/unit/test_trl_grpo_trainer.py" = ["E402"]
"tests/unit/test_rl_losses.py" = ["E402"]
